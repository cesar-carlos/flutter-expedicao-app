# Testes de integração (API/socket) ficam em integration_test/ — não entram no `flutter test` padrão (só test/).
# Gate rápido sem backend: flutter test
# Suite integração opcional: flutter test integration_test

# Testes de integração compartilham o mesmo backend / chaves fixas (ex.: CodSepararEstoque 999999).
# Execução paralela causa estado cruzado; serializar evita flakiness.
concurrency: 1
