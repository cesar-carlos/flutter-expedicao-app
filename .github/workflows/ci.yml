name: CI

on:
  push:
  pull_request:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify source UTF-8 (no double-encoding mojibake)
        run: dart run tool/verify_no_utf8_mojibake.dart

      - name: Analyze
        run: flutter analyze
